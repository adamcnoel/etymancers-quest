name: Tests

on:
  push:
  pull_request:

jobs:
  playthrough:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run playthrough tests
        run: node tests/playthrough.js

      - name: Run UI copy regression
        run: node tests/ui-copy.js
