name: Tests

on:
  push:
  pull_request:

jobs:
  playthrough:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check browser extension syntax
        run: |
          node --check src/core/mastery.js
          node --check src/core/mastery-spacing.js
          node --check src/ui/ui.js
          node --check src/ui/grimoire-status.js
          node --check src/ui/grimoire-sort.js
          node --check src/features/boss-flow.js
          node --check src/ui/cast-copy.js
          node --check src/core/flow-state.js
          node --check src/ui/duel-copy.js
          node --check src/ui/ui-navigation.js
          node --check src/data/bosses.js
          node --check src/features/boss-campaign.js
          node --check src/features/level-hold.js
          node --check src/features/inventory.js
          node --check src/dev/debug.js

      - name: Run playthrough tests
        run: node tests/playthrough.js

      - name: Run campaign playthrough
        run: node tests/campaign-playthrough.js

      - name: Run mastery spacing regression
        run: node tests/mastery-spacing.js

      - name: Run UI copy regression
        run: node tests/ui-copy.js

      - name: Run cast copy regression
        run: node tests/cast-copy.js

      - name: Run duel copy regression
        run: node tests/duel-copy.js

      - name: Run boss campaign regression
        run: node tests/boss-campaign.js

      - name: Run UI architecture regression
        run: node tests/ui-layout.js

      - name: Run UI navigation regression
        run: node tests/ui-navigation.js

      - name: Run navigation state matrix
        run: node tests/navigation-matrix.js

      - name: Run Inventory UI regression
        run: node tests/inventory-ui.js

      - name: Run Grimoire save-status regression
        run: node tests/grimoire-status.js

      - name: Run Grimoire alphabetical-order regression
        run: node tests/grimoire-sort.js

      - name: Run debug tools regression
        run: node tests/debug-tools.js

      - name: Run cache-busting regression
        run: node tests/cache-busting.js

      - name: Run boss transition regression
        run: node tests/boss-transition.js

      - name: Run PWA asset/path regression
        run: node tests/pwa-assets.js
