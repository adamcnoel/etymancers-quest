<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="Etymancer's Quest — a retro dungeon-style vocabulary game for mastering the Latin and Greek roots of words. Cast spells, earn mana, and win spell duels.">

    <!-- Favicon (browser tab / bookmark) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- iOS Home Screen Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    
    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Link manifest for PWA -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Viewport for proper scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <title>Etymancer's Quest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🧙 ETYMANCER'S QUEST 🧙</h1>
            <div class="tagline">Master the roots of words</div>
        </div>
        
        <div class="game-content">
            <div class="stats-panel">
                <div class="stats-title">=== ETYMANCER ===</div>
                <div class="stat-line">Word list: <span id="word-set">—</span></div>
                <div class="stat-line">Level: <span id="level">1</span></div>
                <div class="stat-line">Gold: <span id="gold">0</span></div>
                <div class="stat-line">Mana: <span id="mana">0</span> / <span id="max-mana">30</span></div>
                <div class="stat-line">Streak: <span id="streak">0</span></div>
                <div class="stat-line">Intelligence: <span id="intelligence">10</span></div>
                <div class="stat-line">Strength: <span id="strength">10</span></div>
                <div class="stat-line">Robes: <span id="armor">cloth robe</span></div>
                <div class="stat-line">Staff: <span id="weapon">wooden staff</span></div>
            </div>
            
            <div class="main-panel">
                <div id="game-area">
                    <div>Welcome, Etymancer!</div>
                    <p>Loading your spellbook…</p>
                </div>
            </div>
        </div>
        
        <div class="game-footer">
            <button onclick="game.showHelp()">How to Play</button>
            <button onclick="showShop()">Arcane Emporium</button>
            <button onclick="game.showWordSetPicker()">Word List</button>
            <button onclick="confirmNewGame()" id="new-game-btn">New Game</button>
        </div>
    </div>

    <script src="src/data/roots.js"></script>
    <script src="src/data/roots-list-11.js"></script>
    <script src="src/data/words.js"></script>
    <script src="src/data/equipment.js"></script>
    <script>
        // Remembers which word list was played last.
        const ACTIVE_SET_KEY = 'etymancerWordSet';

        // Definition words too common to accept on their own as an answer.
        const STOPWORDS = new Set(["a", "an", "the", "to", "of", "for", "or", "and",
                                   "in", "on", "at", "is", "it", "its", "out", "very",
                                   "too", "than", "from", "you", "your", "that"]);

        // The selectable word lists ("levels"). Each one names its data, how it
        // words the "define this" question, and what it calls a term; the game
        // logic itself is list-agnostic.
        const WORD_SETS = {
            roots: {
                name: "Roots & Affixes",
                grade: "harder — 8th grade",
                blurb: "Greek and Latin roots, prefixes and suffixes, with example words.",
                termLabel: "root",
                definePrompt: term => `What does '${term}' mean?`,
                rawData: ROOTS
            },
            roots11: {
                name: "The Word Within the Word · List #11",
                grade: "List #11",
                blurb: "25 Greek and Latin word parts from The Word Within the Word, List #11.",
                termLabel: "root",
                definePrompt: term => `What does '${term}' mean?`,
                rawData: ROOTS_LIST_11
            },
            words: {
                name: "Vocabulary Words",
                grade: "easier — 4th grade",
                blurb: "Whole words with several possible meanings — any one of them counts.",
                termLabel: "word",
                definePrompt: term => `What is the definition of '${term}'?`,
                rawData: WORDS
            }
        };

        // Both list shapes collapse to {term: {definitions: [...], examples: [...]}}:
        //   roots.js  -> {definition: "feeling", examples: [...]}
        //   words.js  -> ["bitter", "angry", ...]
        function normalizeWordList(raw) {
            const terms = {};

            for (const [term, info] of Object.entries(raw)) {
                const isMeaningList = Array.isArray(info);
                const definitions = (isMeaningList ? info : [info.definition])
                    .filter(def => typeof def === "string" && def.trim())
                    .map(def => def.trim());

                if (!definitions.length) continue;
                terms[term] = {
                    definitions,
                    examples: isMeaningList ? [] : (info.examples || [])
                };
            }

            return terms;
        }

        // Each list is normalized once here, and its key doubles as its id.
        Object.entries(WORD_SETS).forEach(([id, set]) => {
            set.id = id;
            set.terms = normalizeWordList(set.rawData);
        });

        // Parenthetical context is for the reader only — "mean-spirited (dialogue)"
        // is answered by typing "mean-spirited".
        function stripContext(text) {
            return String(text).replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
        }

        function definitionKey(definition) {
            return stripContext(definition).toLowerCase();
        }

        // One-time upgrade: saves written before word lists existed were all
        // roots games, so move that save under the roots list's own key.
        function migrateLegacySave() {
            const legacy = localStorage.getItem('etymancerSave');
            if (legacy && !localStorage.getItem('etymancerSave:roots')) {
                localStorage.setItem('etymancerSave:roots', legacy);
            }
            if (legacy) localStorage.removeItem('etymancerSave');
        }

        const STARTING_ARMOR = "cloth robe";
        const STARTING_WEAPON = "wooden staff";
        const BASE_STAT = 10;
        const BASE_MAX_MANA = 30;

        // Stats an item grants, or zeroes for anything the catalog doesn't know.
        function gearStats(itemName) {
            const item = (typeof EQUIPMENT !== 'undefined') ? EQUIPMENT[itemName] : null;
            return {
                strength: item ? item.strength : 0,
                intelligence: item ? item.intelligence : 0
            };
        }

        function defaultPlayer() {
            // Starting gear is equipped, so its stats count from the first spell.
            const armor = gearStats(STARTING_ARMOR);
            const weapon = gearStats(STARTING_WEAPON);
            return {
                level: 1,
                strength: BASE_STAT + armor.strength + weapon.strength,
                intelligence: BASE_STAT + armor.intelligence + weapon.intelligence,
                gold: 0,
                mana: 0, maxMana: BASE_MAX_MANA, streak: 0,
                armor: STARTING_ARMOR, weapon: STARTING_WEAPON,
                ownedItems: [STARTING_ARMOR, STARTING_WEAPON]
            };
        }

        class EtymancerGame {
            constructor() {
                this.shopItems = (typeof EQUIPMENT !== 'undefined') ? EQUIPMENT : {};
                this.wordSet = null;
                this.terms = {};
                this.player = null;

                const remembered = localStorage.getItem(ACTIVE_SET_KEY);
                if (WORD_SETS[remembered]) {
                    this.activateWordSet(remembered);
                } else {
                    this.updateStats();
                }
            }

            // Switch to a word list: remember it and load its own saved progress.
            activateWordSet(setId) {
                const set = WORD_SETS[setId];
                if (!set) return;

                this.wordSet = set;
                this.terms = set.terms;
                localStorage.setItem(ACTIVE_SET_KEY, setId);
                this.loadGame();
            }

            escapeHtml(text) {
                return String(text)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            isDefinitionMatch(userAnswer, definition) {
                const guess = definitionKey(userAnswer);
                if (!guess) return false;

                const def = definitionKey(definition);
                if (guess === def) return true;

                return def
                    .split(/[\s,/]+/)
                    .filter(word => word.length >= 3 && !STOPWORDS.has(word))
                    .includes(guess);
            }

            getDefinitionsForTerm(term) {
                const entry = this.terms[term];
                return entry ? entry.definitions : [];
            }

            getExamplesForTerm(term) {
                const entry = this.terms[term];
                return entry ? entry.examples : [];
            }

            getTermsForDefinition(definition) {
                const key = definitionKey(definition);
                return Object.keys(this.terms).filter(term =>
                    this.getDefinitionsForTerm(term).some(def => definitionKey(def) === key));
            }

            getExamplesForDefinition(definition) {
                return [...new Set(
                    this.getTermsForDefinition(definition)
                        .flatMap(term => this.getExamplesForTerm(term))
                )];
            }

            saveKey() {
                return `etymancerSave:${this.wordSet.id}`;
            }

            saveGame() {
                const gameState = {
                    player: this.player,
                    questionsAnswered: this.questionsAnswered,
                    questionPool: this.questionPool
                };
                localStorage.setItem(this.saveKey(), JSON.stringify(gameState));
            }

            loadGame() {
                const saved = localStorage.getItem(this.saveKey());
                if (saved) {
                    const gameState = JSON.parse(saved);
                    this.player = {...defaultPlayer(), ...gameState.player};
                    this.normalizeGearStats();
                    this.questionsAnswered = gameState.questionsAnswered || 0;
                    this.questionPool = (gameState.questionPool || [])
                        .map(q => ({
                            term: q.term || q.root,
                            type: q.type === "definition" ? "definition" : "term"
                        }))
                        .filter(q => this.terms[q.term]);
                } else {
                    this.newGame();
                }
                if (this.questionPool.length === 0) this.refillQuestionPool();
                this.currentQuestion = null;
                this.currentAnswer = null;
                this.duel = null;
                this.updateStats();
            }

            normalizeGearStats() {
                const armor = gearStats(this.player.armor);
                const weapon = gearStats(this.player.weapon);
                this.player.strength = BASE_STAT + armor.strength + weapon.strength;
                this.player.intelligence = BASE_STAT + armor.intelligence + weapon.intelligence;
            }

            newGame() {
                this.player = defaultPlayer();
                this.questionsAnswered = 0;
                this.questionPool = [];
                this.refillQuestionPool();
                this.saveGame();
                this.updateStats();
            }
            
            refillQuestionPool() {
                this.questionPool = [];
                Object.keys(this.terms).forEach(term => {
                    this.questionPool.push({term, type: "definition"});
                    this.questionPool.push({term, type: "term"});
                });
                this.shuffleArray(this.questionPool);
            }
            
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
            
            getGoldReward() {
                return 10 + Math.floor(this.questionsAnswered / 5) * 8;
            }

            getComboMultiplier() {
                return Math.min(5, 1 + Math.floor(this.player.streak / 2));
            }

            registerCast() {
                this.player.streak++;
                const multiplier = this.getComboMultiplier();
                const gold = this.getGoldReward() * multiplier;
                const mana = Math.min(
                    this.player.maxMana - this.player.mana,
                    5 * multiplier
                );
                this.player.gold += gold;
                this.player.mana += mana;
                return {multiplier, gold, mana};
            }

            registerFizzle() {
                this.player.streak = 0;
            }

            evaluateAnswer(userAnswer) {
                const {type, term, definition} = this.currentAnswer;
                if (type === "definition") {
                    return this.getDefinitionsForTerm(term)
                        .some(def => this.isDefinitionMatch(userAnswer, def));
                }
                return this.getTermsForDefinition(definition)
                    .includes(userAnswer.trim().toLowerCase());
            }

            revealAnswer() {
                const {type, term, definition} = this.currentAnswer;
                const label = this.wordSet.termLabel;

                if (type === "definition") {
                    const definitions = this.getDefinitionsForTerm(term);
                    return {
                        headline: definitions.length > 1
                            ? `'${term}' can mean: ${definitions.join('; ')}`
                            : `The ${label} meant: ${definitions[0]}`,
                        examples: this.getExamplesForTerm(term)
                    };
                }

                const terms = this.getTermsForDefinition(definition);
                return {
                    headline: terms.length > 1
                        ? `Valid ${label}s: ${terms.join(', ')}`
                        : `The ${label} was: ${terms[0]}`,
                    examples: this.getExamplesForDefinition(definition)
                };
            }

            renderReveal(lead) {
                const {headline, examples} = this.revealAnswer();
                return `<div class="incorrect">
                    ${lead} ${headline}
                    ${examples.length ? `<div class="examples">Example words: ${examples.join(', ')}</div>` : ''}
                </div>`;
            }

            renderBar(current, max, filledChar = "█", emptyChar = "░", width = 20) {
                const safeMax = Math.max(1, max);
                const clamped = Math.max(0, Math.min(current, safeMax));
                const filled = Math.round((clamped / safeMax) * width);
                return filledChar.repeat(filled) + emptyChar.repeat(width - filled);
            }
            
            updateStats() {
                document.getElementById('word-set').textContent =
                    this.wordSet ? this.wordSet.name : '—';
                if (!this.player) return;
                document.getElementById('level').textContent = this.player.level;
                document.getElementById('gold').textContent = this.player.gold;
                document.getElementById('mana').textContent = this.player.mana;
                document.getElementById('max-mana').textContent = this.player.maxMana;
                document.getElementById('streak').textContent = this.player.streak;
                document.getElementById('strength').textContent = this.player.strength;
                document.getElementById('intelligence').textContent = this.player.intelligence;
                document.getElementById('armor').textContent = this.player.armor;
                document.getElementById('weapon').textContent = this.player.weapon;
            }
            
            generateQuestion() {
                if (this.questionPool.length === 0) {
                    this.refillQuestionPool();
                }
                
                const {term, type} = this.questionPool.pop();

                if (type === "definition") {
                    this.currentQuestion = this.wordSet.definePrompt(term);
                    this.currentAnswer = {type: "definition", term};
                } else {
                    const definitions = this.getDefinitionsForTerm(term);
                    const definition = definitions[
                        Math.floor(Math.random() * definitions.length)
                    ];
                    this.currentQuestion = `What ${this.wordSet.termLabel} means '${definition}'?`;
                    this.currentAnswer = {type: "term", term, definition};
                }
            }
            
            showStart() {
                if (!this.wordSet) return this.showWordSetPicker();

                const set = this.wordSet;
                document.getElementById('game-area').innerHTML = `
                    <div>Welcome back, Etymancer!</div>
                    <p>Every ${set.termLabel} you know fuels your magic. Cast spells by naming
                    ${set.termLabel}s and their meanings to earn gold and mana, then channel
                    that power to defeat bosses in spell duels.</p>
                    <div class="examples">Word list: ${set.name} (${set.grade}) — level ${this.player.level}, ${this.player.gold} gold.</div>
                    <div class="input-area">
                        <button onclick="game.askQuestion()">Begin Casting</button>
                        <button onclick="game.showWordSetPicker()">Change Word List</button>
                    </div>
                `;
            }

            showWordSetPicker() {
                const cards = Object.values(WORD_SETS).map(set => {
                    const active = set === this.wordSet;
                    const count = Object.keys(set.terms).length;
                    return `<div class="shop-item" onclick="game.chooseWordSet('${set.id}')">
                        ${active ? '★' : '▸'} ${set.name} — ${set.grade}${active ? ' (playing now)' : ''}
                        <div class="examples">${set.blurb} ${count} ${set.termLabel}s.</div>
                    </div>`;
                }).join('');

                document.getElementById('game-area').innerHTML = `
                    <div>=== CHOOSE YOUR SPELLBOOK ===</div>
                    <div>Which words do you want to study?</div>
                    <br>
                    ${cards}
                    <div class="examples">Each spellbook keeps its own level, gold and gear, so you can switch back and forth without losing progress.</div>
                    ${this.wordSet ? `<div class="input-area"><button onclick="game.askQuestion()">Keep Casting</button></div>` : ''}
                `;
            }

            chooseWordSet(setId) {
                if (!WORD_SETS[setId]) return;
                this.activateWordSet(setId);
                this.showStart();
            }

            askQuestion() {
                if (!this.wordSet) return this.showWordSetPicker();
                this.generateQuestion();
                this.questionsAnswered++;
                const comboBanner = this.player.streak >= 2
                    ? `<div class="combo">🔥 Combo x${this.getComboMultiplier()} (streak ${this.player.streak}) — earning ${this.getComboMultiplier()}× gold &amp; mana!</div>`
                    : '';
                document.getElementById('game-area').innerHTML = `
                    <div class="question-counter">--- Spell ${this.questionsAnswered} ---</div>
                    ${comboBanner}
                    <div>${this.currentQuestion}</div>
                    <div class="input-area">
                        <input type="text" id="answer-input" placeholder="Speak the incantation..." onkeypress="if(event.key==='Enter') game.submitAnswer()">
                        <button onclick="game.submitAnswer()">Cast</button>
                        <button onclick="game.skipQuestion()">Fizzle</button>
                    </div>
                `;
                document.getElementById('answer-input').focus();
            }
            
            submitAnswer() {
                const userAnswer = document.getElementById('answer-input').value.trim().toLowerCase();
                if (!userAnswer) return;
                
                const correct = this.evaluateAnswer(userAnswer);

                let resultText;
                if (correct) {
                    const cast = this.registerCast();
                    if (cast.multiplier > 1) {
                        resultText = `<div class="correct">✨ Spell cast! <span class="combo">Combo x${cast.multiplier}</span> → +${cast.gold} gold, +${cast.mana} mana <span class="combo">(${cast.multiplier}× the reward!)</span></div>
                            <div class="examples">Keep your streak alive for even bigger hauls — gold buys gear, mana powers duel Channels.</div>`;
                    } else {
                        resultText = `<div class="correct">✨ Spell cast! +${cast.gold} gold, +${cast.mana} mana</div>
                            <div class="examples">Answer correctly again to start a combo and multiply your rewards.</div>`;
                    }
                } else {
                    this.registerFizzle();
                    resultText = this.renderReveal('💨 Your spell fizzles!');
                }

                this.showCastResult(resultText, userAnswer);
            }

            skipQuestion() {
                this.registerFizzle();
                this.showCastResult(this.renderReveal('💨 Spell released.'));
            }

            showCastResult(resultText, userAnswer) {
                this.updateStats();
                this.saveGame();

                document.getElementById('game-area').innerHTML = `
                    <div class="question-counter">--- Spell ${this.questionsAnswered} ---</div>
                    <div>${this.currentQuestion}</div>
                    ${userAnswer ? `<div>Your incantation: ${this.escapeHtml(userAnswer)}</div>` : ''}
                    ${resultText}
                    <div class="input-area">
                        <button onclick="game.nextQuestion()">Continue</button>
                    </div>
                `;

                if (this.questionsAnswered % 10 === 0) {
                    setTimeout(() => this.offerBossFight(), 1000);
                }
            }

            nextQuestion() {
                this.askQuestion();
            }
            
            offerBossFight() {
                const names = ["Gorgon of Garbled Roots", "Lexivore", "The Babbling Wyrm",
                               "Warden of Lost Meanings", "Etymophage"];
                const bossName = names[this.player.level % names.length];
                document.getElementById('game-area').innerHTML = `
                    <div>The air crackles with arcane pressure...</div>
                    <div>A Level ${this.player.level} <span class="combo">${bossName}</span> blocks your path!</div>
                    <br>
                    <div>Defeat it in a spell duel: cast ${this.wordSet.termLabel}s to strike,</div>
                    <div>and channel your mana for devastating blows.</div>
                    <div class="input-area">
                        <button onclick="game.startDuel('${bossName}')">Begin Duel</button>
                        <button onclick="game.askQuestion()">Flee (Keep Casting)</button>
                    </div>
                `;
            }

            startDuel(bossName) {
                const level = this.player.level;
                const bossHp = 60 + level * 35;
                const playerHp = 60 + this.player.strength * 2 + level * 10;
                this.duel = {
                    bossName,
                    bossMaxHp: bossHp,
                    bossHp: bossHp,
                    bossHit: 12 + level * 6,
                    playerMaxHp: playerHp,
                    playerHp: playerHp,
                    duelStreak: 0,
                    channelArmed: false
                };
                this.duelTurn();
            }

            baseSpellDamage() {
                return 12 + Math.floor((this.player.intelligence + this.player.strength) / 3);
            }

            armChannel(on) {
                if (this.duel) this.duel.channelArmed = on;
            }

            duelTurn() {
                this.generateQuestion();
                const d = this.duel;
                const canChannel = this.player.mana >= 10;
                const base = this.baseSpellDamage();
                const streakBonus = (d.duelStreak + 1) * 2;
                const nextDamage = base + streakBonus;

                document.getElementById('game-area').innerHTML = `
                    <div>=== SPELL DUEL: ${d.bossName} ===</div>
                    <div class="incorrect">Boss HP ${d.bossHp}/${d.bossMaxHp}</div>
                    <div class="incorrect">[${this.renderBar(d.bossHp, d.bossMaxHp)}]</div>
                    <div class="correct">Your HP ${d.playerHp}/${d.playerMaxHp}</div>
                    <div class="correct">[${this.renderBar(d.playerHp, d.playerMaxHp)}]</div>
                    <br>
                    <div>Answer to strike. A wrong answer lets the boss hit you for ${d.bossHit}.</div>
                    <div>${this.currentQuestion}</div>
                    <div class="examples">
                        Your spell damage: <b>${nextDamage}</b> = ${base} base (INT+STR) + ${streakBonus} streak.<br>
                        Channel casts the same answer for 10 mana and doubles that whole number:
                        <b>${nextDamage * 2}</b>. (Mana: ${this.player.mana}/${this.player.maxMana})
                        ${canChannel
                            ? `<br><label><input type="checkbox" onchange="game.armChannel(this.checked)" ${d.channelArmed ? 'checked' : ''}> Channel when I press Enter</label>`
                            : `<br>Not enough mana to channel — you need 10.`}
                    </div>
                    <div class="input-area">
                        <input type="text" id="answer-input" placeholder="Speak the incantation..." onkeypress="if(event.key==='Enter') game.duelCast(game.duel.channelArmed)">
                        <button onclick="game.duelCast(false)">⚡ Cast — ${nextDamage} dmg</button>
                        <button onclick="game.duelCast(true)" ${canChannel ? '' : 'disabled'}>${canChannel
                            ? `🔥 Channel — ${nextDamage * 2} dmg (10 mana)`
                            : `🔥 Channel — needs 10 mana`}</button>
                    </div>
                `;
                document.getElementById('answer-input').focus();
            }

            duelCast(channel) {
                const d = this.duel;
                const input = document.getElementById('answer-input');
                const userAnswer = input.value.trim().toLowerCase();
                if (!userAnswer) return;

                let fallbackNote = '';
                if (channel && this.player.mana < 10) {
                    channel = false;
                    fallbackNote = `<div class="incorrect">Not enough mana to channel — you cast normally instead.</div>`;
                }

                const correct = this.evaluateAnswer(userAnswer);
                let outcome;

                if (correct) {
                    d.duelStreak++;
                    let damage = this.baseSpellDamage() + d.duelStreak * 2;
                    if (channel) {
                        this.player.mana -= 10;
                        damage *= 2;
                    }
                    d.bossHp -= damage;
                    outcome = `<div class="correct">✨ Your spell strikes for ${damage}${channel ? ' (CHANNELED — double damage, 10 mana spent!)' : ''}!</div>`;
                } else {
                    d.duelStreak = 0;
                    if (channel) this.player.mana -= 10;
                    d.playerHp -= d.bossHit;
                    const reveal = this.revealAnswer();
                    outcome = `<div class="incorrect">💨 Your spell fizzles! ${reveal.headline}</div>
                               ${channel ? `<div class="incorrect">Your channel is wasted — 10 mana burned.</div>` : ''}
                               <div class="incorrect">The ${d.bossName} strikes back for ${d.bossHit}!</div>`;
                }
                outcome = fallbackNote + outcome;

                this.updateStats();
                this.saveGame();

                if (d.bossHp <= 0) return this.winDuel(outcome);
                if (d.playerHp <= 0) return this.loseDuel(outcome);

                document.getElementById('game-area').innerHTML = `
                    <div>=== SPELL DUEL: ${d.bossName} ===</div>
                    <div class="incorrect">Boss HP ${Math.max(0, d.bossHp)}/${d.bossMaxHp}  [${this.renderBar(d.bossHp, d.bossMaxHp)}]</div>
                    <div class="correct">Your HP ${Math.max(0, d.playerHp)}/${d.playerMaxHp}  [${this.renderBar(d.playerHp, d.playerMaxHp)}]</div>
                    <br>
                    ${outcome}
                    <div class="input-area">
                        <button onclick="game.duelTurn()">Next Exchange</button>
                    </div>
                `;
            }

            winDuel(outcome) {
                this.player.level++;
                const goldReward = 50 + this.player.level * 10;
                this.player.gold += goldReward;
                this.player.mana = this.player.maxMana;
                const bossName = this.duel.bossName;
                this.duel = null;
                this.updateStats();
                this.saveGame();
                document.getElementById('game-area').innerHTML = `
                    ${outcome}
                    <div class="correct">⚔️ VICTORY! ⚔️</div>
                    <div>You vanquished the ${bossName}!</div>
                    <div>Level up! Now level ${this.player.level}</div>
                    <div>+${goldReward} gold, and your mana is fully restored!</div>
                    <div class="input-area">
                        <button onclick="game.askQuestion()">Continue Casting</button>
                    </div>
                `;
            }

            loseDuel(outcome) {
                const bossName = this.duel.bossName;
                this.player.streak = 0;
                this.duel = null;
                this.updateStats();
                this.saveGame();
                document.getElementById('game-area').innerHTML = `
                    ${outcome}
                    <div class="incorrect">💀 DEFEATED! 💀</div>
                    <div>The ${bossName} overwhelms you. Your progress is safe —</div>
                    <div>gather gold, buy stronger robes and staves, and return.</div>
                    <div class="input-area">
                        <button onclick="showShop()">Arcane Emporium</button>
                        <button onclick="game.askQuestion()">Keep Casting</button>
                    </div>
                `;
            }
            
            showHelp() {
                if (!this.wordSet) return this.showWordSetPicker();
                const termLabel = this.wordSet.termLabel;
                document.getElementById('game-area').innerHTML = `
                    <div>=== HOW TO PLAY ===</div>
                    <br>
                    <div class="combo">The loop:</div>
                    <div class="examples">Cast spells → build a streak → bigger combo → more gold &amp; mana → better gear + more Channels → win duels → level up.</div>
                    <br>
                    <div class="combo">Casting</div>
                    <div class="examples">
                        Answer a word question to cast a spell. Correct = gold + mana.
                        Wrong or Fizzle = you lose your streak (but learn the answer).
                        Questions alternate between the two directions: what a
                        ${termLabel} means, and which ${termLabel}s carry a given meaning.
                    </div>
                    <br>
                    <div class="combo">Word lists</div>
                    <div class="examples">
                        The <b>Word List</b> button switches spellbooks:
                        ${Object.values(WORD_SETS).map(s => `<b>${s.name}</b> (${s.grade})`).join(' or ')}.
                        Each keeps its own level, gold and gear.
                        You're playing <b>${this.wordSet.name}</b>.
                    </div>
                    <br>
                    <div class="combo">Streaks &amp; combos</div>
                    <div class="examples">
                        Each correct answer in a row raises your combo (x2, x3… up to x5),
                        which multiplies BOTH the gold and mana you earn. One miss resets it to x1.
                    </div>
                    <br>
                    <div class="combo">Gold, mana, INT &amp; STR</div>
                    <div class="examples">
                        Gold buys robes &amp; staves in the Emporium, which raise Intelligence
                        and Strength — INT + STR set your spell damage, and STR also adds
                        duel HP. A new item <b>replaces</b> the one in that slot (the old one
                        waits in your vault), and the strongest gear unlocks as you level up.
                        Gold also buys mana crystals, which raise your maximum mana.
                    </div>
                    <br>
                    <div class="combo">Spell duels</div>
                    <div class="examples">
                        Every 10 spells a boss appears. Take turns answering: correct hits
                        the boss (damage from INT+STR plus a per-duel streak bonus), wrong lets
                        it hit you. <b>Cast</b> is a normal hit; <b>Channel</b> is the same hit
                        for 10 mana that doubles the whole number shown. Tick "Channel when I
                        press Enter" to channel from the keyboard. Win to level up, refill mana,
                        and keep your casting streak.
                    </div>
                    <div class="input-area">
                        <button onclick="game.askQuestion()">Back to Casting</button>
                    </div>
                `;
            }

            levelTierLimit() {
                return 100 + this.player.level * 120;
            }

            levelNeededFor(cost) {
                return Math.max(1, Math.ceil((cost - 100) / 120));
            }

            manaUpgrade() {
                const cap = BASE_MAX_MANA + this.player.level * 10;
                return {
                    cost: this.player.maxMana * 10,
                    amount: 10,
                    cap,
                    available: this.player.maxMana < cap
                };
            }

            buyManaUpgrade() {
                const upgrade = this.manaUpgrade();
                if (!upgrade.available) return this.showShop();
                if (this.player.gold < upgrade.cost) {
                    return this.showPurchaseFailure(upgrade.cost);
                }
                this.player.gold -= upgrade.cost;
                this.player.maxMana += upgrade.amount;
                this.updateStats();
                this.saveGame();
                this.showPurchaseResult(
                    `Mana crystal absorbed! Max mana is now ${this.player.maxMana}.`);
            }

            netVsEquipped(itemName) {
                const item = this.shopItems[itemName];
                const slot = item.type === "armor" ? this.player.armor : this.player.weapon;
                const current = gearStats(slot);
                return {
                    strength: item.strength - current.strength,
                    intelligence: item.intelligence - current.intelligence
                };
            }

            renderStatDelta(net) {
                const part = (value, label) =>
                    `${value >= 0 ? '+' : ''}${value} ${label}`;
                return `${part(net.strength, 'STR')}, ${part(net.intelligence, 'INT')}`;
            }

            showShop() {
                if (!this.wordSet) return this.showWordSetPicker();
                const goldLimit = this.player.gold + 100;
                const tierLimit = this.levelTierLimit();

                let shopHTML = `<div>=== ARCANE EMPORIUM ===</div>
                    <div>Spend gold on robes and staves to deepen your power.</div>
                    <div class="examples">Equipping replaces what's in that slot, so the numbers
                    below are the change to <b>your</b> stats. Currently wearing
                    ${this.player.armor} and wielding ${this.player.weapon}
                    (${this.player.strength} STR, ${this.player.intelligence} INT).</div><br>`;

                let hasItems = false;
                let lockedLevel = null;

                Object.entries(this.shopItems).forEach(([item, stats]) => {
                    if (this.player.ownedItems.includes(item)) return;

                    if (stats.cost > tierLimit) {
                        const needed = this.levelNeededFor(stats.cost);
                        if (stats.cost <= goldLimit && (lockedLevel === null || needed < lockedLevel)) {
                            lockedLevel = needed;
                        }
                        return;
                    }
                    if (stats.cost > goldLimit) return;

                    hasItems = true;
                    const affordable = stats.cost <= this.player.gold;
                    const symbol = affordable ? '✓' : '✗';
                    const className = affordable ? 'affordable' : 'unaffordable';
                    const net = this.netVsEquipped(item);
                    shopHTML += `<div class="shop-item ${className}" onclick="game.buyItem('${item}')">
                        ${symbol} ${item}: ${stats.cost} gold (${this.renderStatDelta(net)} for you)
                    </div>`;
                });

                const upgrade = this.manaUpgrade();
                if (upgrade.available && upgrade.cost <= goldLimit) {
                    hasItems = true;
                    const affordable = upgrade.cost <= this.player.gold;
                    shopHTML += `<div class="shop-item ${affordable ? 'affordable' : 'unaffordable'}" onclick="game.buyManaUpgrade()">
                        ${affordable ? '✓' : '✗'} mana crystal: ${upgrade.cost} gold
                        (+${upgrade.amount} max mana, now ${this.player.maxMana}/${upgrade.cap} for level ${this.player.level})
                    </div>`;
                }

                if (!hasItems) {
                    shopHTML += '<div>The shelves are bare for now — you own all you can afford!</div><br>';
                }
                if (lockedLevel !== null) {
                    shopHTML += `<div class="examples">Stronger gear than this is held back until level ${lockedLevel}. Win duels to unlock it.</div>`;
                }

                const vault = this.player.ownedItems.filter(item =>
                    this.shopItems[item] &&
                    item !== this.player.armor &&
                    item !== this.player.weapon);
                if (vault.length) {
                    shopHTML += '<br><div>=== YOUR VAULT ===</div>';
                    vault.forEach(item => {
                        const net = this.netVsEquipped(item);
                        shopHTML += `<div class="shop-item" onclick="game.equipItem('${item}')">
                            ▸ equip ${item} (${this.renderStatDelta(net)} for you)
                        </div>`;
                    });
                }

                shopHTML += `<div class="input-area">
                    <button onclick="game.askQuestion()">Back to Casting</button>
                </div>`;

                document.getElementById('game-area').innerHTML = shopHTML;
            }

            equipItem(itemName) {
                const item = this.shopItems[itemName];
                if (!item || !this.player.ownedItems.includes(itemName)) return;

                const net = this.netVsEquipped(itemName);
                this.player.strength += net.strength;
                this.player.intelligence += net.intelligence;
                if (item.type === "armor") {
                    this.player.armor = itemName;
                } else {
                    this.player.weapon = itemName;
                }

                this.updateStats();
                this.saveGame();
                return net;
            }

            buyItem(itemName) {
                const item = this.shopItems[itemName];
                if (!item) return;
                if (this.player.gold < item.cost) return this.showPurchaseFailure(item.cost);

                this.player.gold -= item.cost;
                if (!this.player.ownedItems.includes(itemName)) {
                    this.player.ownedItems.push(itemName);
                }
                const net = this.equipItem(itemName);
                this.showPurchaseResult(
                    `Acquired and equipped ${itemName}! (${this.renderStatDelta(net)})`);
            }

            showPurchaseResult(message) {
                document.getElementById('game-area').innerHTML = `
                    <div class="correct">${message}</div>
                    <div class="input-area">
                        <button onclick="game.showShop()">Keep Browsing</button>
                        <button onclick="game.askQuestion()">Back to Casting</button>
                    </div>
                `;
            }

            showPurchaseFailure(cost) {
                document.getElementById('game-area').innerHTML = `
                    <div class="incorrect">Not enough gold! Need ${cost} gold.</div>
                    <div class="input-area">
                        <button onclick="game.showShop()">Back to Emporium</button>
                    </div>
                `;
            }
        }
        
        migrateLegacySave();
        let game = new EtymancerGame();
        game.showStart();

        function startGame() {
            game.askQuestion();
        }
        
        function showShop() {
            game.showShop();
        }
        
        function confirmNewGame() {
            const btn = document.getElementById('new-game-btn');
            if (btn.textContent === 'New Game') {
                const listName = game.wordSet ? game.wordSet.name : 'this';
                btn.textContent = `Start a new game? This resets your ${listName} progress.`;
                btn.onclick = () => newGame();
                setTimeout(() => {
                    if (btn.textContent !== 'New Game') {
                        btn.textContent = 'New Game';
                        btn.onclick = () => confirmNewGame();
                    }
                }, 5000);
            }
        }
        
        function newGame() {
            if (!game.wordSet) return game.showWordSetPicker();
            game.newGame();
            document.getElementById('game-area').innerHTML = `
                <div class="correct">🎮 NEW GAME STARTED! 🎮</div>
                <div>Progress on the ${game.wordSet.name} list has been reset. Ready for a fresh adventure?</div>
                <div class="input-area">
                    <button onclick="startGame()">Start Playing</button>
                </div>
            `;
            const btn = document.getElementById('new-game-btn');
            btn.textContent = 'New Game';
            btn.onclick = () => confirmNewGame();
        }
    </script>
    <script src="src/bootstrap.js"></script>
</body>
